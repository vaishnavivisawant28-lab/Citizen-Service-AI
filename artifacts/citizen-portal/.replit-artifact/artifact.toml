kind = "web"
previewPath = "/"
title = "Citizen Service Portal"
version = "1.0.0"
id = "artifacts/citizen-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24767

[services.development]
run = "pnpm --filter @workspace/citizen-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/citizen-portal", "run", "build" ]
publicDir = "artifacts/citizen-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24767"
BASE_PATH = "/"
